name: 🤖 Android CI/CD - Simple & Strict

on:
  push:
    branches: [main, master, develop]
    tags: ['v*']
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

# Cancelar ejecuciones anteriores en la misma rama
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

# ============================================
# JOBS
# ============================================
jobs:
  # ============================================
  # 1️⃣ CODE QUALITY
  # ============================================
  code-quality:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🔧 Grant Execute Permission
        run: chmod +x gradlew

      - name: 📊 Run Android Lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: false

      - name: 📤 Upload Lint Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: |
            **/build/reports/lint/**/*.html
            **/build/reports/lint/**/*.xml
          retention-days: 30

  # ============================================
  # 2️⃣ UNIT TESTS
  # ============================================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [code-quality]
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🔧 Grant Execute Permission
        run: chmod +x gradlew

      - name: 🧪 Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: 📤 Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**/*.html
          retention-days: 30

  # ============================================
  # 3️⃣ BUILD APKs (Debug + Release)
  # ============================================
  build-apks:
    name: 📦 Build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [unit-tests]
    
    outputs:
      version-name: ${{ steps.version.outputs.version-name }}
      version-code: ${{ steps.version.outputs.version-code }}
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🔧 Grant Execute Permission
        run: chmod +x gradlew

      - name: 📊 Get Version Info
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts 2>/dev/null || echo "1.0.0")
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts 2>/dev/null || echo "1")
          echo "version-name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version-code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "✅ Version: $VERSION_NAME ($VERSION_CODE)"

      - name: 🏗️ Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 🏗️ Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: 📊 Show APK Info
        run: |
          echo "## 📦 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| APK | Size | Path |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|------|------|" >> $GITHUB_STEP_SUMMARY
          for apk in app/build/outputs/apk/**/*.apk; do
            if [ -f "$apk" ]; then
              size=$(du -h "$apk" | cut -f1)
              name=$(basename "$apk")
              echo "| $name | $size | \`$apk\` |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-v${{ steps.version.outputs.version-name }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v${{ steps.version.outputs.version-name }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

  # ============================================
  # 4️⃣ GITHUB RELEASE (Solo para tags)
  # ============================================
  github-release:
    name: 🚀 GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-apks]
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: 📥 Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug-v${{ needs.build-apks.outputs.version-name }}
          path: ./artifacts/debug

      - name: 📥 Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-v${{ needs.build-apks.outputs.version-name }}
          path: ./artifacts/release

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/debug/*.apk
            ./artifacts/release/*.apk
          body: |
            ## 📱 Release v${{ needs.build-apks.outputs.version-name }}
            
            ### 📥 Downloads
            | Tipo | Descripción |
            |------|-------------|
            | **Debug APK** | Para testing, con logging habilitado |
            | **Release APK** | Optimizado para producción |
            
            ### ✅ Pipeline Status
            - [x] Code Quality (Lint)
            - [x] Unit Tests
            - [x] Build APKs
            
            ### 🔗 Info
            - **Commit**: ${{ github.sha }}
            - **Branch**: ${{ github.ref_name }}
            
            _Generado automáticamente por GitHub Actions_
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # 5️⃣ PIPELINE SUMMARY
  # ============================================
  pipeline-summary:
    name: 📊 Pipeline Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-apks, github-release]
    if: always()
    
    steps:
      - name: 📊 Create Summary
        run: |
          echo "## 🎯 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Code Quality | ${{ needs.build-apks.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🧪 Unit Tests | ${{ needs.build-apks.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Build APKs | ${{ needs.build-apks.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Release | ${{ needs.github-release.result == 'success' && '✅' || needs.github-release.result == 'skipped' && '⏭️' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📱 Version: ${{ needs.build-apks.outputs.version-name }}"
          echo "### 🔗 Commit: ${{ github.sha }}"
